bind -n C-5 if -F '#{m:*:5:*,:#{W:#{window_index}:,#{window_index}:}}' { if -F '#{==:#{window_index},5}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t :5 } } { if -F '#{window_end_flag}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t '{end}' } }
bind -n C-6 if -F '#{m:*:6:*,:#{W:#{window_index}:,#{window_index}:}}' { if -F '#{==:#{window_index},6}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t :6 } } { if -F '#{window_end_flag}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t '{end}' } }
bind -n C-7 if -F '#{m:*:7:*,:#{W:#{window_index}:,#{window_index}:}}' { if -F '#{==:#{window_index},7}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t :7 } } { if -F '#{window_end_flag}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t '{end}' } }
bind -n C-8 if -F '#{m:*:8:*,:#{W:#{window_index}:,#{window_index}:}}' { if -F '#{==:#{window_index},8}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t :8 } } { if -F '#{window_end_flag}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t '{end}' } }
bind -n C-9 if -F '#{m:*:9:*,:#{W:#{window_index}:,#{window_index}:}}' { if -F '#{==:#{window_index},9}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t :9 } } { if -F '#{window_end_flag}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t '{end}' } }
bind -n C-0 if -F '#{m:*:10:*,:#{W:#{window_index}:,#{window_index}:}}' { if -F '#{==:#{window_index},10}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t :10 } } { if -F '#{window_end_flag}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t '{end}' } }

