bind -n M-r source-file $PERMEANCE_TREE/.config/tmux/tmux.conf
bind -n M-q detach
bind -n M-K kill-server
# M-w closes the current pane -- or its window when it is the last pane, or the
# whole session when that is its last window -- then focuses the NEXT pane or
# window; Alt+Shift+w (M-W) focuses the PREVIOUS one instead. Neither wraps:
# with nothing in that direction (next from the last, prev from the first), they
# step the other way. Panes and windows are handled by tmux alone: step, then
# kill {last}, the pane or window just left. Only closing a session's last
# window runs the shell (__tmux_kill_session focuses the previous session
# first). Previously both went through run-shell: about ten tmux calls in a row,
# ~150 ms with typed keys held back, a quarter of it saving the closing pane's
# path and command for a reopen nothing binds any more (M-T, below).
# Superseded, kept for reference, with M-W's older kill-the-session binding:
# bind -n M-w run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_save_window_state "$(tmux display-message -p "##{pane_current_path}")" "$(tmux display-message -p "##{pane_current_command}")"; __tmux_kill_pane next'
# bind -n M-W run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_save_window_state "$(tmux display-message -p "##{pane_current_path}")" "$(tmux display-message -p "##{pane_current_command}")"; __tmux_kill_pane prev'
# bind -n M-W run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_kill_session'
bind -n M-w if -F '#{!=:#{window_panes},1}' { if -F '#{==:#{e|-:#{pane_index},#{pane-base-index}},#{e|-:#{window_panes},1}}' { select-pane -t '{previous}' } { select-pane -t '{next}' } ; kill-pane -t '{last}' } { if -F '#{!=:#{session_windows},1}' { if -F '#{window_end_flag}' { select-window -p } { select-window -n } ; kill-window -t '{last}' } { run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_kill_session' } }
bind -n M-W if -F '#{!=:#{window_panes},1}' { if -F '#{==:#{pane_index},#{pane-base-index}}' { select-pane -t '{next}' } { select-pane -t '{previous}' } ; kill-pane -t '{last}' } { if -F '#{!=:#{session_windows},1}' { if -F '#{window_start_flag}' { select-window -n } { select-window -p } ; kill-window -t '{last}' } { run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_kill_session' } }
bind -n M-t new-window -a -c "#{pane_current_path}"
bind -n M-n run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_new_session'
# New session moved from M-T (Alt+Shift+t) to M-n (Alt+n). The unbind makes an
# M-r reload of a running server drop M-T too, not just a fresh start. Earlier,
# M-T reopened the last-closed window. Both prior bindings kept for reference.
unbind -n M-T
# bind -n M-T run-shell 'source $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_new_session'
# bind -n M-T run-shell 'source $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_reopen_window'

# bind -n M-N command-prompt 'rename-session %%'
# bind -n M-r command-prompt 'rename-window %%'
bind -n M-c command-prompt 'show-options -s'

bind -n M-h split-window -v -l 8
bind -n M-v split-window -h

# Toggle a bottom pane running the flake watcher (watch -> nix flake check)
# bind -n M-b run-shell 'sh $PERMEANCE_TREE/.config/tmux/scripts/watch-build.sh 8'

# Alt+Tab / Alt+Shift+Tab cycle sessions. Alacritty emits ESC+Tab / ESC+BTab
# for these (see .config/alacritty/alacritty.toml), which arrive here as M-Tab /
# M-BTab. Previously M-Tab/M-BTab cycled panes; superseded, kept for reference:
#   bind -n M-Tab select-pane -t+1
#   bind -n M-BTab select-pane -t-1
bind -n M-Tab switch-client -n
bind -n M-BTab switch-client -p
bind -n M-PageDown select-window -t+1
bind -n M-PageUp select-window -t-1
bind -n M-Down select-window -t+1
bind -n M-Up select-window -t-1
bind -n C-S-PageDown swap-window -t+1 \; select-window -t+1
bind -n C-S-PageUp swap-window -t-1 \; select-window -t-1
bind -n C-S-Down swap-window -t+1 \; select-window -t+1
bind -n C-S-Up swap-window -t-1 \; select-window -t-1
bind -n C-S-k swap-window -t+1 \; select-window -t+1
bind -n C-S-j swap-window -t-1 \; select-window -t-1
# Mouse drag-to-reorder in the status bar: window titles (centre) and session names
# (left). @wdrag/@sdrag flag which kind of grab is live; @mx/@smx track the cursor
# column for the below-the-bar direction stepping. Both clear on any release, and
# MouseDown resets stale flags first. Each reset runs only while a flag is set:
# setting any option redraws every attached client in full, on every click.
#
# WINDOWS. On the title row the swap is exact: MouseDown marks the grabbed window and
# each MouseDrag swaps the mark with the window under the pointer (swap-window's own
# -t= can't resolve the pointer, but select-window -t= can). Below the titles tmux
# exposes only mouse_x, so the pane handler re-selects the marked window and steps it
# one index per @wstep columns of travel; window_end_flag / window_index guard the
# ends against wrap. Numeric e|>= / e|<= are required (plain >= / <= are string
# compares, so "10" <= "7"), and the columns are 2-digit.
# Below the bar mouse_x counts from the left edge of the pane the drag first
# entered there (tmux keeps the drag on that pane; left of it mouse_x is empty,
# i.e. 0), so the pane handler adds pane_left and keeps that screen column in @x.
# It reads @x before any swap, after which pane_left would read the active pane.
# A title-row mouse_x can't start the count either: it counts from the active
# pane when that pane spans the column, and the first drag event pairs the
# press's location with the moved pointer's mouse_x. So the title-row handlers
# clear @mx and the first pane event sets it: travel counts from where the
# pointer leaves the bar. A pane border it crosses would start tmux's default
# pane resize instead (MouseDrag1Border), so the border is inert during a drag.
#
# SESSIONS. tmux has no swap-session and #{S:} is creation-ordered, so the list is
# rendered sorted-by-number (status-left, below) and a drag swaps the grabbed
# session's number with its neighbour (__tmux_drag_session). Each label's range
# stops after its first space. tmux ends a range one cell late (format-draw.c
# sets the end to cx + 1) and a click takes the first range that matches, so a
# range over both spaces also took the next label's first cell, and a click
# there picked the session on its left. Stopped a space early, the late end
# covers the second space, so -t= is the session under the pointer on any of a
# label's cells. MouseDown switches to it (mouse_x would count from a pane, see
# WINDOWS), and on the bar the drag steps the grab toward the label under the
# pointer. #{client_session} tracks the grab across the renames. Below the bar
# no label is under the pointer, so there the drag steps one number per @sstep
# screen columns, counted as for windows: @x, from where the pointer leaves the
# bar (@smx).
set -g @wdrag 0
set -g @mx 0
set -g @wstep 4
set -g @sdrag 0
set -g @smx 0
set -g @sstep 3
bind -n MouseDown1Status { select-pane -M ; if -F '#{||:#{@wdrag},#{@sdrag}}' { set -g @wdrag 0 ; set -g @sdrag 0 } ; if -F '#{==:#{mouse_status_range},window}' { select-window -t= ; select-pane -m ; set -g @mx '' ; set -g @wdrag 1 } { if -F '#{==:#{mouse_status_range},session}' { switch-client -t= ; set -g @smx '' ; set -g @sdrag 1 } { switch-client -t= } } }
bind -n MouseDrag1Status { if -F '#{@wdrag}' { select-window -t= ; swap-window ; set -g @mx '' } ; if -F '#{@sdrag}' { set -g @smx '' ; if -F '#{&&:#{==:#{mouse_status_range},session},#{!=:#{session_name},#{client_session}}}' { run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_drag_session #{client_session} #{?#{e|>:#{session_name},#{client_session}},1,-1}' } } }
bind -n MouseDrag1Pane { if -F '#{@sdrag}' { set -Fg @x '#{e|+:#{mouse_x},#{pane_left}}' ; if -F '#{==:#{@smx},}' { set -Fg @smx '#{@x}' } ; if -F '#{e|>=:#{@x},#{e|+:#{@smx},#{@sstep}}}' { run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_drag_session #{client_session} 1' ; set -Fg @smx '#{@x}' } ; if -F '#{e|<=:#{@x},#{e|-:#{@smx},#{@sstep}}}' { run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_drag_session #{client_session} -1' ; set -Fg @smx '#{@x}' } } { if -F '#{@wdrag}' { set -Fg @x '#{e|+:#{mouse_x},#{pane_left}}' ; select-window -t'{marked}' ; if -F '#{==:#{@mx},}' { set -Fg @mx '#{@x}' } ; if -F '#{e|>=:#{@x},#{e|+:#{@mx},#{@wstep}}}' { if -F '#{?window_end_flag,0,1}' { swap-window -d -t:+1 } ; set -Fg @mx '#{@x}' } ; if -F '#{e|<=:#{@x},#{e|-:#{@mx},#{@wstep}}}' { if -F '#{e|>:#{window_index},1}' { swap-window -d -t:-1 } ; set -Fg @mx '#{@x}' } } { if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M } } } }
bind -n MouseDrag1Border if -F '#{||:#{@wdrag},#{@sdrag}}' {} { resize-pane -M }
bind -n MouseDragEnd1Status if -F '#{||:#{@wdrag},#{@sdrag}}' { set -g @wdrag 0 ; set -g @sdrag 0 ; select-pane -M }
bind -n MouseUp1Status if -F '#{||:#{@wdrag},#{@sdrag}}' { set -g @wdrag 0 ; set -g @sdrag 0 ; select-pane -M }
bind -n MouseDown1Pane { if -F '#{||:#{@wdrag},#{@sdrag}}' { set -g @wdrag 0 ; set -g @sdrag 0 ; select-pane -M } ; select-pane -t= ; send-keys -M }
# A release over a pane ends a status-bar drag. Any other release is passed on
# (send-keys -M) to the pane's program, as tmux does when nothing binds these
# keys: without it nvim or fzf --mouse would see a press that is never released.
bind -n MouseDragEnd1Pane if -F '#{||:#{@wdrag},#{@sdrag}}' { set -g @wdrag 0 ; set -g @sdrag 0 ; select-pane -M } { send-keys -M }
bind -n MouseUp1Pane if -F '#{||:#{@wdrag},#{@sdrag}}' { set -g @wdrag 0 ; set -g @sdrag 0 ; select-pane -M } { send-keys -M }
# Releasing past the centred window list (empty status area) or on a session lands
# here; clear the grab so no marked-pane border lingers. Anything not covered is
# reset by the top of the next MouseDown.
bind -n MouseDragEnd1StatusDefault if -F '#{||:#{@wdrag},#{@sdrag}}' { set -g @wdrag 0 ; set -g @sdrag 0 ; select-pane -M }
bind -n MouseUp1StatusDefault if -F '#{||:#{@wdrag},#{@sdrag}}' { set -g @wdrag 0 ; set -g @sdrag 0 ; select-pane -M }
bind -n C-Space run-shell 'sh $PERMEANCE_TREE/.config/tmux/scripts/toggle-pane.sh 15'
bind -n C-Enter switch-client -n
bind -n C-S-Enter switch-client -p
bind -n C-M-Enter run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session next'
bind -n C-M-S-Enter run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session prev'

# Sessions are named numerically by __tmux_new_session and compacted back to a
# gap-free 1..N when one closes (the session-closed hook near the top), so M-<n>
# targets the session labelled <n> in the status bar, mirroring C-<n> for windows:
# press it again while already there to toggle back to the previous session.
# Unlike windows there is no clamp-to-last fallback -- pressing M-<n> past the
# last session does nothing rather than selecting the last one.
bind -n M-1 if -F '#{m:*:1:*,:#{S:#{session_name}:,#{session_name}:}}' { if -F '#{==:#{session_name},1}' { if -F '#{!=:#{client_last_session},}' { switch-client -l } } { switch-client -t =1 } }
bind -n M-2 if -F '#{m:*:2:*,:#{S:#{session_name}:,#{session_name}:}}' { if -F '#{==:#{session_name},2}' { if -F '#{!=:#{client_last_session},}' { switch-client -l } } { switch-client -t =2 } }
bind -n M-3 if -F '#{m:*:3:*,:#{S:#{session_name}:,#{session_name}:}}' { if -F '#{==:#{session_name},3}' { if -F '#{!=:#{client_last_session},}' { switch-client -l } } { switch-client -t =3 } }
bind -n M-4 if -F '#{m:*:4:*,:#{S:#{session_name}:,#{session_name}:}}' { if -F '#{==:#{session_name},4}' { if -F '#{!=:#{client_last_session},}' { switch-client -l } } { switch-client -t =4 } }
bind -n M-5 if -F '#{m:*:5:*,:#{S:#{session_name}:,#{session_name}:}}' { if -F '#{==:#{session_name},5}' { if -F '#{!=:#{client_last_session},}' { switch-client -l } } { switch-client -t =5 } }
bind -n M-6 if -F '#{m:*:6:*,:#{S:#{session_name}:,#{session_name}:}}' { if -F '#{==:#{session_name},6}' { if -F '#{!=:#{client_last_session},}' { switch-client -l } } { switch-client -t =6 } }
bind -n M-7 if -F '#{m:*:7:*,:#{S:#{session_name}:,#{session_name}:}}' { if -F '#{==:#{session_name},7}' { if -F '#{!=:#{client_last_session},}' { switch-client -l } } { switch-client -t =7 } }
bind -n M-8 if -F '#{m:*:8:*,:#{S:#{session_name}:,#{session_name}:}}' { if -F '#{==:#{session_name},8}' { if -F '#{!=:#{client_last_session},}' { switch-client -l } } { switch-client -t =8 } }
bind -n M-9 if -F '#{m:*:9:*,:#{S:#{session_name}:,#{session_name}:}}' { if -F '#{==:#{session_name},9}' { if -F '#{!=:#{client_last_session},}' { switch-client -l } } { switch-client -t =9 } }
bind -n M-0 if -F '#{m:*:10:*,:#{S:#{session_name}:,#{session_name}:}}' { if -F '#{==:#{session_name},10}' { if -F '#{!=:#{client_last_session},}' { switch-client -l } } { switch-client -t =10 } }

bind -n C-1 if -F '#{m:*:1:*,:#{W:#{window_index}:,#{window_index}:}}' { if -F '#{==:#{window_index},1}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t :1 } } { if -F '#{window_end_flag}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t '{end}' } }
bind -n C-2 if -F '#{m:*:2:*,:#{W:#{window_index}:,#{window_index}:}}' { if -F '#{==:#{window_index},2}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t :2 } } { if -F '#{window_end_flag}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t '{end}' } }
bind -n C-3 if -F '#{m:*:3:*,:#{W:#{window_index}:,#{window_index}:}}' { if -F '#{==:#{window_index},3}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t :3 } } { if -F '#{window_end_flag}' { if -F '#{W:#{?window_last_flag,Y,},}' { last-window } } { select-window -t '{end}' } }
