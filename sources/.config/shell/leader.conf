# Leader-key aliases: press space (or enter) on an empty prompt, then type a
# chord; the picker narrows on the chord and dispatches the selection.
#
# One [group] per tool, then one chord per line, in four columns separated by
# a tab or two spaces (a single space stays inside a column):
#
#   chord        the keys typed after the leader; <space> is the space key
#   mode         run        insert the command and run it
#                edit       insert it and leave it for editing
#                eval       the command prints the real one (fzf-backed
#                           helpers), which is inserted and run
#                eval-edit  the same, left for editing
#   description  breadcrumb shown next to the command (the group is prepended)
#   command      the rest of the line; <name> marks a placeholder
#
# A chord on adjacent lines is a submenu, which fzf can only resolve by
# tab-selecting, since the chord never narrows to one. A command longer than
# one short command belongs in a function under functions/.
#
# Edit the table with the oa chord: when the editor closes, it lines up the
# columns (leader-aliases -fmt, packages/leader-aliases) and reopens the
# editor at a broken line. Edited any other way, a broken line shows up in the
# prompt and every chord stays dead until it is fixed.

