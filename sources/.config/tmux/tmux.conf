# Alt+Shift+<n> moves the current window to session <n> (the numeric session names in
# the status bar / M-<n> range), following the window there. The by-number analogue of
# C-M-Enter / C-M-S-Enter (move current window to next/prev session) and a sibling of
# C-S-<n> (send the current window to window index <n>). Alacritty emits these as CSI-u
# M-S-<n> (see .config/alacritty/alacritty.toml). No-op if <n> is the current session or
# no session is named <n>, matching M-<n> (which does nothing past the last session).
bind -n M-S-1 run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session_number 1'
bind -n M-S-2 run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session_number 2'
bind -n M-S-3 run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session_number 3'
bind -n M-S-4 run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session_number 4'
bind -n M-S-5 run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session_number 5'
bind -n M-S-6 run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session_number 6'
bind -n M-S-7 run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session_number 7'
bind -n M-S-8 run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session_number 8'
bind -n M-S-9 run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session_number 9'
bind -n M-S-0 run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_move_window_to_session_number 10'

# M-n = new session is bound above via run-shell. Superseded popup variant:
# bind -n M-n display-popup -E 'source $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_new_session'
bind -n M-Enter display-popup -E '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_switch_session'
bind -n M-S-Enter display-popup -E '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_switch_window'

bind -n M-S run-shell $NIX_OUT_TMUX/.config/tmux/plugins/resurrect/scripts/save.sh
bind -n M-R run-shell $NIX_OUT_TMUX/.config/tmux/plugins/resurrect/scripts/restore.sh
# bind -n M-l run-shell -b '$NIX_OUT_TMUX/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch'

# _________________________________ Status

set -g status-interval 1
set -g status-style bg=default
set -g status-position top
set -g status-right ""
set -g status-left-length 200
# Sessions in status-left, rendered sorted by their (numeric) name so a mouse drag
# can reorder them. #{S:} iterates in creation order and cannot sort, so unroll one
# filtered pass per number 1..10 (the M-<n> range) and append them in order; each
# emits a clickable range (where it ends: SESSIONS above) and whites the
# session the viewing client is on. Reorder
# = swap two numbers (drag bindings below -> __tmux_drag_session); >10 sessions,
# like M-<n>, are not shown.
set -g status-left ""
set -ga status-left "#{S:#{?#{==:#{session_name},1},#[range=session|#{session_id}]#[fg=#{?#{==:#{session_name},#{client_session}},#ffffff,#7a7c9e}]#{session_name} #[norange] ,}}"
set -ga status-left "#{S:#{?#{==:#{session_name},2},#[range=session|#{session_id}]#[fg=#{?#{==:#{session_name},#{client_session}},#ffffff,#7a7c9e}]#{session_name} #[norange] ,}}"
set -ga status-left "#{S:#{?#{==:#{session_name},3},#[range=session|#{session_id}]#[fg=#{?#{==:#{session_name},#{client_session}},#ffffff,#7a7c9e}]#{session_name} #[norange] ,}}"
set -ga status-left "#{S:#{?#{==:#{session_name},4},#[range=session|#{session_id}]#[fg=#{?#{==:#{session_name},#{client_session}},#ffffff,#7a7c9e}]#{session_name} #[norange] ,}}"
set -ga status-left "#{S:#{?#{==:#{session_name},5},#[range=session|#{session_id}]#[fg=#{?#{==:#{session_name},#{client_session}},#ffffff,#7a7c9e}]#{session_name} #[norange] ,}}"
set -ga status-left "#{S:#{?#{==:#{session_name},6},#[range=session|#{session_id}]#[fg=#{?#{==:#{session_name},#{client_session}},#ffffff,#7a7c9e}]#{session_name} #[norange] ,}}"
set -ga status-left "#{S:#{?#{==:#{session_name},7},#[range=session|#{session_id}]#[fg=#{?#{==:#{session_name},#{client_session}},#ffffff,#7a7c9e}]#{session_name} #[norange] ,}}"
set -ga status-left "#{S:#{?#{==:#{session_name},8},#[range=session|#{session_id}]#[fg=#{?#{==:#{session_name},#{client_session}},#ffffff,#7a7c9e}]#{session_name} #[norange] ,}}"
set -ga status-left "#{S:#{?#{==:#{session_name},9},#[range=session|#{session_id}]#[fg=#{?#{==:#{session_name},#{client_session}},#ffffff,#7a7c9e}]#{session_name} #[norange] ,}}"
set -ga status-left "#{S:#{?#{==:#{session_name},10},#[range=session|#{session_id}]#[fg=#{?#{==:#{session_name},#{client_session}},#ffffff,#7a7c9e}]#{session_name} #[norange] ,}}"
set -g status-justify centre
set -g window-status-current-format "#[fg=#ffffff]#I #W"
set -g window-status-format "#[fg=#7a7c9e]#I #W"
set -g window-status-separator "  "

# _________________________________ Colors

set -g copy-mode-match-style "bg=#5d00ff"
set -g copy-mode-current-match-style "bg=#ffffff,fg=#000000"
set -g mode-style "reverse"
# Since tmux 3.7 a message or prompt is drawn over the status line and only
# clears the rest of it with a fill colour; without one the session and window
# list shows around it. terminal is the terminal's own background (default
# means no fill).
set -g message-style "fg=#ffffff,bg=default,fill=terminal"
set -g message-command-style "fg=#ffffff,bg=default,fill=terminal"
set -g pane-border-style "fg=#262e3b"
set -g pane-active-border-style "fg=#4a4aa8"
set -g popup-border-style "fg=#262e3b"
# cursor-style

# _________________________________ Server options

set -s escape-time 0
# pasting newline in neovim puts ^[[27;5;106~ chars
# https://github.com/tmux/tmux/issues/4175
# https://github.com/tmux/tmux/issues/4163
# set -s extended-keys off
# set -s extended-keys on
set -s extended-keys always # https://github.com/tmux/tmux/issues/2705 (< tmux 3.5)
set -s extended-keys-format csi-u # KEYS in .zshrc are written in the CSI u encoding
set -s focus-events on
# Programs inside tmux can neither set nor read the clipboard through it, as the
# tmux wiki and the terminals (Alacritty, Ghostty, kitty) advise: external passes
# on only tmux's own copies, and get-clipboard off ignores a pane's OSC 52 query
# (which, with set-clipboard on, gets the newest paste buffer).
set -s set-clipboard external
set -s get-clipboard off
set -g allow-passthrough on
# set -s terminal-overrides $TERM
set -sa terminal-overrides ",alacritty:RGB" # true color support
set -sa terminal-overrides ',alacritty:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colours
set -sa terminal-overrides ',alacritty:smcup@:rmcup@' # disable faux scrolling

# _________________________________ Autoload

# Nothing autoloads. tmux-resurrect's resurrect.tmux only binds prefix keys,
# unreachable with prefix None, sets restore strategies for irb and mosh, and
# records its script paths for tmux-continuum; M-S and M-R (above) call save.sh
# and restore.sh directly. It took ~70 ms of every config load: server start
# and M-r. Superseded, kept for reference:
# run-shell $NIX_OUT_TMUX/.config/tmux/plugins/resurrect/resurrect.tmux

# _________________________________ Plugins options

# Keep this under ~/.local/state/tmux: the claude-sandbox launcher masks that
# directory (its __cs_creds list), since the saves hold every pane's scrollback.
set -g @resurrect-dir "$HOME/.local/state/tmux/plugins/resurrect"
# Also save/restore each pane's scrollback (default: off). save.sh archives
# `capture-pane -epJ` output to $@resurrect-dir/pane_contents.tar.gz; restore.sh
# replays it into the pane, then execs the shell. Restores buffer text only --
# not the program that produced it.
set -g @resurrect-capture-pane-contents 'on'
