# bind -n M-W run-shell 'source $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_save_window_state "#{pane_current_path}" "#{pane_current_command}"; __tmux_kill_pane prev'
bind -n M-w run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_save_window_state "#{pane_current_path}" "#{pane_current_command}"; __tmux_kill_pane next'
bind -n M-t new-window -a -c "#{pane_current_path}"
bind -n M-T run-shell '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_new_session'
# Previously M-T: reopen the last-closed window. Superseded by M-T = new session;
