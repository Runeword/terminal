# A starter table for the leader-aliases zsh plugin. Copy it to
# ~/.config/leader-aliases/leader.conf (or point LEADER_ALIASES_FILE at your
# own), then press Space on an empty prompt and type a chord.
#
# One [group] per tool, then one chord per line, in four columns separated by
# a tab or two spaces (a single space stays inside a column):
#
#   chord        the keys typed after the leader; <space> is the space key
#   mode         run        insert the command and run it
#                edit       insert it and leave it for editing
#                eval       the command prints the real one (an fzf picker,
#                           say), which is inserted and run
#                eval-edit  the same, left for editing
#   description  breadcrumb shown next to the command (the group is prepended)
#   command      the rest of the line
#
# A chord on adjacent lines is a submenu, which fzf can only resolve by
# tab-selecting, since the chord never narrows to one; so is a chord that
# starts another one (g, next to a gs). leader-aliases-edit (le below) edits
# the table and lines up its columns.

[git]
gs 	run  	status          	git status
gl 	run  	log             	git log --oneline -20
gd 	run  	diff            	git diff
gc 	edit 	commit          	git commit -m
gb 	eval 	branch › switch 	git branch --format='git switch %(refname:short)' | fzf

[files]
fl 	run 	list 	ls -la
fu 	run 	up   	cd ..

[leader]
le 	run 	edit this table 	leader-aliases-edit
