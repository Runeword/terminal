version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    # A revision is proposed once it is a week old: long enough for a
    # compromised or broken upstream commit to be noticed and reverted before
    # dependabot-auto-merge.yml lands it.
    cooldown:
      default-days: 7
    ignore:
      # Pinned channels — we manually decide when to bump these.
      # Bumping the channel ref defeats the purpose of the pin
      # (see overlays/default.nix for what they pin).
      - dependency-name: "nixpkgs-24-05"
      - dependency-name: "nixpkgs-25-11"
      # Private repo; Dependabot's repo-scoped token can't
      # reach it → git_dependencies_not_reachable, which reddened the weekly
      # "nix in /." job. Bump this input manually.
      - dependency-name: "permeance"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
