# Extends the git-allowlist-hook AND the git-shim with additional subcommands.
# Both layers always permit a built-in read-only set (status, diff, log, show,
# branch, rev-parse, config, remote, ls-files, blame) plus anything listed
# here, and deny every other subcommand.
#
# Enforced on top of the subcommand check (both layers):
#   - `-c`, `--config-env`, `--exec-path` are rejected — they inject arbitrary
#     execution, e.g. `git -c core.fsmonitor=<cmd> status`.
#   - exec-capable git env vars (GIT_EXTERNAL_DIFF, GIT_SSH_COMMAND, GIT_PAGER,
#     GIT_CONFIG_*, …) are stripped by the shim / denied by the hook.
#   - `git config` and `git remote` are read-only; their write forms are denied
#     (config set/unset/…, remote add/set-url/remove/rename/prune/update/…).
#   - subcommand flags that run a command are rejected even for an allowlisted
#     subcommand: --upload-pack / --receive-pack / --exec (any subcommand, e.g.
#     `git fetch --upload-pack=<cmd>`), rebase -x / -i / --interactive, and
#     grep -O / --open-files-in-pager.
#
# Mostly NOT enforced otherwise: other subcommand-specific flags are trusted.
# Adding a subcommand here trusts the rest of its flags — allowing "push" also
# allows "git push --force". Only add subcommands whose flags you will permit.

allow = [
  "version",
  "hash-object",
  "rev-list",
  "add",
  "fetch",
  "merge-base",
  "ls-tree",
  "worktree",
  "stash",
  "cat-file",
  "rebase",
  "check-ignore",
  "init",
  "path-id",
  "grep",
  "checkout",
  "config",
]
