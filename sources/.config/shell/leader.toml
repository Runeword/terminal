# Leader-key aliases: press space (or enter) on an empty prompt, then type a
# chord; the picker narrows on the chord and dispatches the selection.
#
# One [group] per tool, one chord per key. A chord is an inline table or, for
# a submenu (the same chord listed more than once), an array of them; fzf can
# only resolve those by tab-selecting, since the chord never narrows to one.
#
#   cmd  (required)  shell text inserted into the line; <name> marks a placeholder
#   desc             breadcrumb shown next to the command (the group is prepended)
#   run  = true      accept the line at once; false leaves it in the line for editing
#   eval = false     true: cmd prints the real command (fzf-backed helpers), which
#                    is then inserted (and run unless run = false)
#
# Quote cmd with '...' (no escapes); use "..." only when it contains a '.
# Rendered by leader-aliases (packages/custom); a parse error shows up in the
# prompt and every chord stays dead until it is fixed.

[zoxide]
" " = { cmd = '__zoxide_zi', desc = 'jump (fzf)' }

