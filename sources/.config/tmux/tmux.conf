# tmux v3.5a

set -g default-shell "$TMUX_SHELL" # $SHELL (login shell) is the shell by default
set -g base-index 1
set -g pane-base-index 1
# set-hook -g session-created 'if -F "#{==:#{hook_session_name},0}" "rename-session 1"'
# set -g automatic-rename on
# set -g automatic-rename-format "#{I} #{b;=4:pane_current_path}_#{=4:pane_current_command}"
set-option -g automatic-rename on
# set-option -g automatic-rename-format '#{b:pane_current_path}'
set-option -g automatic-rename-format '#{=6:pane_current_command}'
set -g renumber-windows on
# No native renumber-sessions exists (sessions are keyed by name, not index), so
# emulate it: when a session closes, compact the numerically-named sessions back
# to a gap-free 1..N -- the session-level analogue of renumber-windows above.
# __tmux_new_session names sessions numerically, so this keeps the M-<n> session
# targets (below) contiguous; an attached session just follows its own rename.
# -b so the kill never blocks the server on the renumber (fire-and-forget).
set-hook -g session-closed "run-shell -b '. $PERMEANCE_TREE/.config/shell/functions/tmux.sh; __tmux_renumber_sessions'"
set -g display-time 500
set -g status-keys emacs
setw -g aggressive-resize off
setw -g clock-mode-style 12
set -ga update-environment XDG_RUNTIME_DIR
set -g history-limit 50000
set -gw mouse on
set -gw mode-keys vi
set -g default-terminal "tmux-256color"
# set -g status-keys vi

# _________________________________ Key bindings

# Disable the prefix so C-b passes through to the shell (every binding below uses -n)
unbind C-b
set -g prefix None

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
