extends:
  - lefthook-generated.yml
pre-push:
  commands:
    smoke:
      # Stream nix's build logs live to the terminal
      interactive: true
      # No glob, so every push runs it: nix rebuilds only the checks whose
      # inputs changed, and a push that changes none of them costs one
      # evaluation. (lefthook still skips a push that only deletes files.)
      # Check the commit being pushed (HEAD), not the working tree, whose
      # uncommitted edits (another session's work) would fail the push. A stale
      # committed flake.lock fails rather than being silently rewritten.
      run: nix flake check "git+file://$(git rev-parse --show-toplevel)?rev=$(git rev-parse HEAD)" --no-update-lock-file -L --keep-going -j auto
