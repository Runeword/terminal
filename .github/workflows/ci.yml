name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # GitHub's default limit is 6 hours. A passing run takes minutes; one still
    # going after 30 is compiling something no cache has (Firefox on macOS, for
    # one) and would otherwise run until that limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: runeword-terminal
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # A token that reads the three private inputs and nothing else, revoked
      # when the job ends. Both secrets are set twice, as Actions and as
      # Dependabot secrets: a run Dependabot triggers sees only the latter.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: inputs-token
        with:
          client-id: ${{ secrets.INPUTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.INPUTS_APP_PRIVATE_KEY }}
          repositories: permeance,claude-sandbox,claude-microvm
          permission-contents: read
      # flake.nix fetches those inputs over ssh; in the two steps that fetch
      # them, git rewrites the address to https with the token.
      - run: nix flake check -L --keep-going
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.inputs-token.outputs.token }}@github.com/Runeword/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/Runeword/
      - if: ${{ runner.os == 'macOS' && !cancelled() }}
        run: .github/scripts/macos-sandbox.sh
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.inputs-token.outputs.token }}@github.com/Runeword/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/Runeword/
  # Stable-name gate for branch protection — required-status context = "check".
  # Survives matrix changes; only this job's name is load-bearing.
  check:
    if: always()
    needs: matrix-check
    runs-on: ubuntu-latest
    steps:
      - if: ${{ !contains(needs.*.result, 'success') || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
